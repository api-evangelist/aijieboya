aid: aijieboya
name: Aijieboya
description: 'Suzhou Aijie Boya Technology Co., Ltd. (苏州艾捷博雅科技有限公司), trading internationally
  as Agilebio, is a Suzhou Industrial Park manufacturer of chromatography separation and purification
  technology founded in 2020 by Dr. Wang Qunjie. It develops high-purity spherical silica gel
  chromatographic media, magnetic solid-phase extraction (mSPE) consumables and precision fluid
  automation instruments — the AutoY32 automated sample pretreatment system, the SmartPurifier
  preparative MPLC series and the Bonnasil filler lines — for biopharmaceutical manufacturing,
  clinical mass spectrometry, peptide and nucleic-acid drug purification and food testing
  laboratories. It runs the Agilebio and Biosepur brands and an "Industrial Chromatography 4.0"
  platform. An instrument and consumables maker: it publishes no public API, SDK, developer portal
  or machine-readable contract.'
